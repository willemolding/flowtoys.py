[project]
name = "flowtoys"
version = "0.1.0"
description = "Control FlowToys props through a Flowtoys Bridge over Bluetooth LE, from Python or lighting software (sACN / DMX)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Willem Olding" }]
keywords = ["flowtoys", "bluetooth", "ble", "bleak", "led", "dmx", "sacn", "e131", "qlcplus"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia",
    "Topic :: System :: Hardware",
    "Typing :: Typed",
]
dependencies = [
    "bleak>=3.0.2",
]

[project.scripts]
flowtoys = "flowtoys.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = ["src", "fixture_defs", "LICENSE", "PROTOCOL.md", "README.md"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "ruff>=0.17.0",
]
